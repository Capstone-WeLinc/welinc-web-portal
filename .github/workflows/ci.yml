name: CI

on:
  pull_request:
    branches: [development]
  push:
    branches: [development]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Fails on a known high or critical hole in what ships; dev tools are left out
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test
      # Spec 0010: a production build needs a real https address; this one only satisfies the check
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://api.ci.example.test
